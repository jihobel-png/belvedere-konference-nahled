name: Publish Belvedere preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belvedere-public-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check frontend
        run: node --check site/app.js
      - name: Build approved preview
        env:
          FONTS_BUILD_PASSWORD: ${{ secrets.FONTS_BUILD_PASSWORD }}
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
